services:
  db:
    image: postgres:16-alpine
    container_name: roommate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roommate_db}
      POSTGRES_USER: ${POSTGRES_USER:-roommate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - roommate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional GUI for browsing the database.
  # Start with: docker compose --profile tools up -d
  # Then open http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: roommate-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@roommate.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  roommate_pgdata:
